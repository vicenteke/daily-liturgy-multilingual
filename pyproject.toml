[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-liturgy"
version = "0.1.0"
description = "Daily Catholic Mass readings from official sources, in multiple languages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["daily_liturgy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live official source (deselected by default)"]
addopts = "-m 'not network'"
